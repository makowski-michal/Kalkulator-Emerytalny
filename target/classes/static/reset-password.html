<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nowe hasło – Kalkulator Płacowy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="login-card card p-4 mt-5">
    <div class="login-logo">🔒 Ustaw nowe hasło</div>
    <div id="alertBox" class="alert d-none" role="alert"></div>
    <form id="resetForm">
      <div class="mb-3">
        <label class="form-label">Nowe hasło (min. 6 znaków)</label>
        <input type="password" id="newPassword" class="form-control" minlength="6" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Powtórz hasło</label>
        <input type="password" id="confirmPassword" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Zmień hasło</button>
    </form>
  </div>
</div>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('alertBox').textContent = 'Nieprawidłowy link resetujący';
    document.getElementById('alertBox').className = 'alert alert-danger';
  }

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alert = document.getElementById('alertBox');
    const pw = document.getElementById('newPassword').value;
    const pw2 = document.getElementById('confirmPassword').value;
    if (pw !== pw2) {
      alert.textContent = 'Hasła nie są identyczne';
      alert.className = 'alert alert-danger';
      return;
    }
    const res = await fetch('/api/v1/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, newPassword: pw }),
      credentials: 'include'
    });
    const data = await res.json();
    alert.textContent = data.message || data.error;
    alert.className = 'alert ' + (res.ok ? 'alert-success' : 'alert-danger');
    if (res.ok) setTimeout(() => window.location.href = 'login.html', 2000);
  });
</script>
</body>
</html>
