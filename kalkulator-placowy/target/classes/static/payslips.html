<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historia wypłat – Kalkulator Płacowy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="d-flex">
  <div class="sidebar d-none d-md-block" style="width:220px;min-width:220px">
    <div class="px-3 pb-3 fw-bold fs-6 border-bottom border-white border-opacity-25 mb-2">
      💼 Kalkulator Płacowy
    </div>
    <span class="nav-section">Pracownik</span>
    <a href="employee-dashboard.html">🏠 Pulpit</a>
    <a href="payslips.html" class="active">📋 Historia wypłat</a>
    <a href="retirement.html">🏦 Emerytura</a>
    <div class="mt-auto p-3" style="position:absolute;bottom:0;width:220px">
      <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">Wyloguj</button>
    </div>
  </div>

  <div class="flex-grow-1 p-4">
    <h4 class="mb-4">Historia wypłat</h4>

    <div class="card p-3 mb-4">
      <div class="row g-2 align-items-end">
        <div class="col-auto">
          <label class="form-label mb-1 small">Rok</label>
          <select id="filterYear" class="form-select form-select-sm" style="width:100px">
            <option value="">Wszystkie</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label mb-1 small">Miesiąc</label>
          <select id="filterMonth" class="form-select form-select-sm" style="width:140px">
            <option value="">Wszystkie</option>
            <option value="1">Styczeń</option><option value="2">Luty</option>
            <option value="3">Marzec</option><option value="4">Kwiecień</option>
            <option value="5">Maj</option><option value="6">Czerwiec</option>
            <option value="7">Lipiec</option><option value="8">Sierpień</option>
            <option value="9">Wrzesień</option><option value="10">Październik</option>
            <option value="11">Listopad</option><option value="12">Grudzień</option>
          </select>
        </div>
        <div class="col-auto">
          <button onclick="loadPayslips()" class="btn btn-primary btn-sm">Filtruj</button>
        </div>
      </div>
    </div>

    <div class="card">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>Okres</th>
            <th class="text-end">Brutto</th>
            <th class="text-end">Netto</th>
            <th class="text-end">Koszt pracodawcy</th>
            <th class="text-center">Akcje</th>
          </tr>
        </thead>
        <tbody id="payslipList">
          <tr><td colspan="5" class="text-center text-muted py-4">Ładowanie...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal szczegółów paska -->
<div class="modal fade" id="payslipModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header" style="background:var(--primary);color:#fff">
        <h5 class="modal-title" id="payslipModalTitle">Pasek płacowy</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="payslipModalBody"></div>
      <div class="modal-footer">
        <button onclick="downloadCurrentPdf()" class="btn btn-outline-primary btn-sm">⬇ Pobierz PDF</button>
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Zamknij</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/payslips.js"></script>
<script>
(async () => {
  const user = await requireAuth('EMPLOYEE');
  if (!user) return;
  const yr = document.getElementById('filterYear');
  const now = new Date().getFullYear();
  for (let y = now; y >= now - 5; y--) {
    yr.innerHTML += `<option value="${y}">${y}</option>`;
  }
  await loadPayslips();
})();
</script>
</body>
</html>
