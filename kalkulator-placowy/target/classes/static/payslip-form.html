<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generuj pasek – Kalkulator Płacowy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="d-flex">
  <div class="sidebar d-none d-md-block" style="width:220px;min-width:220px">
    <div class="px-3 pb-3 fw-bold fs-6 border-bottom border-white border-opacity-25 mb-2">
      💼 Kalkulator Płacowy
    </div>
    <span class="nav-section">Pracodawca</span>
    <a href="employer-dashboard.html">🏠 Pulpit</a>
    <a href="employees.html">👥 Pracownicy</a>
    <a href="payslip-form.html" class="active">📄 Generuj pasek</a>
    <a href="absences.html">📅 Nieobecności</a>
    <a href="company-settings.html">🏢 Dane firmy</a>
    <div class="mt-auto p-3" style="position:absolute;bottom:0;width:220px">
      <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">Wyloguj</button>
    </div>
  </div>

  <div class="flex-grow-1 p-4">
    <h4 class="mb-4">Generowanie paska płacowego</h4>
    <div id="alertBox" class="alert d-none"></div>

    <div class="card p-4 mb-4">
      <form id="payslipForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Pracownik *</label>
            <select id="employeeSelect" class="form-select" required>
              <option value="">-- wybierz --</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Rok *</label>
            <select id="periodYear" class="form-select" required></select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Miesiąc *</label>
            <select id="periodMonth" class="form-select" required>
              <option value="1">Styczeń</option><option value="2">Luty</option>
              <option value="3">Marzec</option><option value="4">Kwiecień</option>
              <option value="5">Maj</option><option value="6">Czerwiec</option>
              <option value="7">Lipiec</option><option value="8">Sierpień</option>
              <option value="9">Wrzesień</option><option value="10">Październik</option>
              <option value="11">Listopad</option><option value="12">Grudzień</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Premia (PLN)</label>
            <input type="number" id="bonus" class="form-control" value="0" min="0" step="0.01">
          </div>
          <div class="col-md-3">
            <label class="form-label">Dodatki (PLN)</label>
            <input type="number" id="allowances" class="form-control" value="0" min="0" step="0.01">
          </div>
          <div class="col-md-3">
            <label class="form-label">Potrącenie komornicze</label>
            <input type="number" id="garnishment" class="form-control" value="0" min="0" step="0.01">
          </div>
          <div class="col-md-3">
            <label class="form-label">Potrącenie dobrowolne</label>
            <input type="number" id="voluntaryDeduction" class="form-control" value="0" min="0" step="0.01">
          </div>
          <div class="col-md-4">
            <label class="form-label">Data sporządzenia</label>
            <input type="date" id="documentDate" class="form-control">
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button type="button" onclick="previewPayslip()" class="btn btn-outline-primary">👁 Podgląd</button>
          <button type="submit" class="btn btn-success" id="saveBtn" disabled>💾 Zapisz pasek</button>
        </div>
      </form>
    </div>

    <!-- Preview -->
    <div id="previewCard" class="card p-4 d-none">
      <h6 class="mb-3">Podgląd paska płacowego</h6>
      <div id="previewContent"></div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/payslips.js"></script>
<script>
let previewData = null;

(async () => {
  const user = await requireAuth('EMPLOYER');
  if (!user) return;

  const now = new Date();
  const yr = document.getElementById('periodYear');
  for (let y = now.getFullYear(); y >= now.getFullYear() - 3; y--) {
    yr.innerHTML += `<option value="${y}" ${y === now.getFullYear() ? 'selected' : ''}>${y}</option>`;
  }
  document.getElementById('periodMonth').value = now.getMonth() + 1;

  // Pre-select from URL
  const params = new URLSearchParams(window.location.search);
  const preselected = params.get('employeeId');

  const res = await fetch('/api/v1/employees', { credentials: 'include' });
  const employees = res.ok ? await res.json() : [];
  const sel = document.getElementById('employeeSelect');
  employees.forEach(e => {
    const opt = new Option(`${e.lastName} ${e.firstName}`, e.id);
    sel.add(opt);
  });
  if (preselected) sel.value = preselected;

  document.getElementById('payslipForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!previewData) return;
    const body = buildBody();
    const res = await fetch('/api/v1/payslips', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      credentials: 'include'
    });
    if (res.ok) {
      const ab = document.getElementById('alertBox');
      ab.textContent = 'Pasek zapisany pomyślnie';
      ab.className = 'alert alert-success';
      document.getElementById('saveBtn').disabled = true;
    } else {
      const err = await res.json().catch(() => ({}));
      showAlert(err.error || 'Błąd zapisu', 'danger');
    }
  });
})();

function buildBody() {
  return {
    employeeId:        parseInt(document.getElementById('employeeSelect').value),
    periodYear:        parseInt(document.getElementById('periodYear').value),
    periodMonth:       parseInt(document.getElementById('periodMonth').value),
    bonus:             parseFloat(document.getElementById('bonus').value) || 0,
    allowances:        parseFloat(document.getElementById('allowances').value) || 0,
    garnishment:       parseFloat(document.getElementById('garnishment').value) || 0,
    voluntaryDeduction: parseFloat(document.getElementById('voluntaryDeduction').value) || 0,
    documentDate:      document.getElementById('documentDate').value || null
  };
}

async function previewPayslip() {
  const empId = document.getElementById('employeeSelect').value;
  if (!empId) { showAlert('Wybierz pracownika', 'warning'); return; }

  const body = buildBody();
  const res = await fetch('/api/v1/payslips?preview=true', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    credentials: 'include'
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    showAlert(err.error || 'Błąd obliczenia', 'danger');
    return;
  }
  previewData = await res.json();
  document.getElementById('previewContent').innerHTML = renderPayslipDetail(previewData);
  document.getElementById('previewCard').classList.remove('d-none');
  document.getElementById('saveBtn').disabled = false;
}

function showAlert(msg, type) {
  const ab = document.getElementById('alertBox');
  ab.textContent = msg;
  ab.className = `alert alert-${type}`;
}
</script>
</body>
</html>
