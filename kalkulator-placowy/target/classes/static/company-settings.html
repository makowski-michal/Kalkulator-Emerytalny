<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dane firmy – Kalkulator Płacowy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="d-flex">
  <div class="sidebar d-none d-md-block" style="width:220px;min-width:220px">
    <div class="px-3 pb-3 fw-bold fs-6 border-bottom border-white border-opacity-25 mb-2">
      💼 Kalkulator Płacowy
    </div>
    <span class="nav-section">Pracodawca</span>
    <a href="employer-dashboard.html">🏠 Pulpit</a>
    <a href="employees.html">👥 Pracownicy</a>
    <a href="payslip-form.html">📄 Generuj pasek</a>
    <a href="absences.html">📅 Nieobecności</a>
    <a href="company-settings.html" class="active">🏢 Dane firmy</a>
    <div class="mt-auto p-3" style="position:absolute;bottom:0;width:220px">
      <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">Wyloguj</button>
    </div>
  </div>

  <div class="flex-grow-1 p-4">
    <h4 class="mb-4">Dane firmy</h4>
    <div id="alertBox" class="alert d-none"></div>

    <div class="card p-4" style="max-width:500px">
      <form id="companyForm">
        <div class="mb-3">
          <label class="form-label">Nazwa firmy *</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">NIP (10 cyfr)</label>
          <input type="text" id="nip" class="form-control" maxlength="10" pattern="\d{10}">
        </div>
        <div class="mb-3">
          <label class="form-label">REGON</label>
          <input type="text" id="regon" class="form-control" maxlength="14">
        </div>
        <button type="submit" class="btn btn-primary">Zapisz</button>
      </form>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
(async () => {
  const user = await requireAuth('EMPLOYER');
  if (!user) return;

  const res = await fetch('/api/v1/company', { credentials: 'include' });
  if (res.ok) {
    const c = await res.json();
    document.getElementById('name').value  = c.name  || '';
    document.getElementById('nip').value   = c.nip   || '';
    document.getElementById('regon').value = c.regon || '';
  }

  document.getElementById('companyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const ab = document.getElementById('alertBox');
    const r = await fetch('/api/v1/company', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name:  document.getElementById('name').value,
        nip:   document.getElementById('nip').value,
        regon: document.getElementById('regon').value
      }),
      credentials: 'include'
    });
    const data = await r.json();
    ab.textContent = data.message || data.error;
    ab.className = 'alert ' + (r.ok ? 'alert-success' : 'alert-danger');
  });
})();
</script>
</body>
</html>
