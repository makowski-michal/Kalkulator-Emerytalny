<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset hasła – Kalkulator Płacowy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="login-card card p-4 mt-5">
    <div class="login-logo">🔑 Resetowanie hasła</div>
    <div id="alertBox" class="alert d-none" role="alert"></div>
    <form id="forgotForm">
      <div class="mb-3">
        <label class="form-label">Adres e-mail konta</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Wyślij link resetujący</button>
    </form>
    <div class="text-center mt-3">
      <a href="login.html" class="text-muted small">Powrót do logowania</a>
    </div>
  </div>
</div>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alert = document.getElementById('alertBox');
    const res = await fetch('/api/v1/auth/forgot-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value }),
      credentials: 'include'
    });
    const data = await res.json();
    alert.textContent = data.message || data.error;
    alert.className = 'alert ' + (res.ok ? 'alert-success' : 'alert-danger');
  });
</script>
</body>
</html>
