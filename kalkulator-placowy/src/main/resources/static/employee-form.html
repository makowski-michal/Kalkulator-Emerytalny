<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karta pracownika – Kalkulator Płacowy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="d-flex">
  <div class="sidebar d-none d-md-block" style="width:220px;min-width:220px">
    <div class="px-3 pb-3 fw-bold fs-6 border-bottom border-white border-opacity-25 mb-2">
      💼 Kalkulator Płacowy
    </div>
    <span class="nav-section">Pracodawca</span>
    <a href="employer-dashboard.html">🏠 Pulpit</a>
    <a href="employees.html" class="active">👥 Pracownicy</a>
    <a href="payslip-form.html">📄 Generuj pasek</a>
    <a href="absences.html">📅 Nieobecności</a>
    <div class="mt-auto p-3" style="position:absolute;bottom:0;width:220px">
      <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">Wyloguj</button>
    </div>
  </div>

  <div class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0" id="pageTitle">Karta pracownika</h4>
      <a href="employees.html" class="btn btn-outline-secondary btn-sm">← Wróć</a>
    </div>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="card p-4">
      <form id="employeeForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Imię *</label>
            <input type="text" id="firstName" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Nazwisko *</label>
            <input type="text" id="lastName" class="form-control" required>
          </div>
          <div id="newUserFields">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">E-mail (login) *</label>
                <input type="email" id="email" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Tymczasowe hasło *</label>
                <input type="password" id="tempPassword" class="form-control" minlength="6">
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label">PESEL</label>
            <input type="text" id="pesel" class="form-control" maxlength="11" pattern="\d{11}">
          </div>
          <div class="col-md-4">
            <label class="form-label">Data urodzenia *</label>
            <input type="date" id="birthDate" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Planowany wiek emerytalny</label>
            <input type="number" id="retirementAge" class="form-control" value="65" min="55" max="80">
          </div>
          <div class="col-12">
            <label class="form-label">Adres zamieszkania</label>
            <input type="text" id="address" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Wynagrodzenie zasadnicze brutto (PLN) *</label>
            <input type="number" id="grossSalary" class="form-control" min="0.01" step="0.01" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Kod tytułu ZUS</label>
            <input type="text" id="zusTitleCode" class="form-control" maxlength="6">
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <div class="form-check mb-1">
              <input class="form-check-input" type="checkbox" id="taxRelief" checked>
              <label class="form-check-label" for="taxRelief">Ulga podatkowa (PIT-2)</label>
            </div>
          </div>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-primary">Zapisz</button>
          <a href="employees.html" class="btn btn-outline-secondary ms-2">Anuluj</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
const employeeId = new URLSearchParams(window.location.search).get('id');
const isEdit = !!employeeId;

(async () => {
  const user = await requireAuth('EMPLOYER');
  if (!user) return;

  if (isEdit) {
    document.getElementById('pageTitle').textContent = 'Edycja pracownika';
    document.getElementById('newUserFields').style.display = 'none';

    const res = await fetch(`/api/v1/employees/${employeeId}`, { credentials: 'include' });
    if (!res.ok) { alert('Nie znaleziono pracownika'); return; }
    const e = await res.json();

    document.getElementById('firstName').value    = e.firstName;
    document.getElementById('lastName').value     = e.lastName;
    document.getElementById('pesel').value        = e.pesel || '';
    document.getElementById('address').value      = e.address || '';
    document.getElementById('birthDate').value    = e.birthDate;
    document.getElementById('retirementAge').value = e.retirementAge;
    document.getElementById('grossSalary').value  = e.grossSalary;
    document.getElementById('zusTitleCode').value = e.zusTitleCode || '';
    document.getElementById('taxRelief').checked  = e.taxRelief;
  }

  document.getElementById('employeeForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const alertBox = document.getElementById('alertBox');
    alertBox.classList.add('d-none');

    let res;
    if (isEdit) {
      const body = {
        firstName:      document.getElementById('firstName').value,
        lastName:       document.getElementById('lastName').value,
        pesel:          document.getElementById('pesel').value || null,
        address:        document.getElementById('address').value || null,
        retirementAge:  parseInt(document.getElementById('retirementAge').value),
        grossSalary:    parseFloat(document.getElementById('grossSalary').value),
        zusTitleCode:   document.getElementById('zusTitleCode').value || null,
        taxRelief:      document.getElementById('taxRelief').checked
      };
      res = await fetch(`/api/v1/employees/${employeeId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        credentials: 'include'
      });
    } else {
      const body = {
        firstName:      document.getElementById('firstName').value,
        lastName:       document.getElementById('lastName').value,
        email:          document.getElementById('email').value,
        tempPassword:   document.getElementById('tempPassword').value,
        pesel:          document.getElementById('pesel').value || null,
        address:        document.getElementById('address').value || null,
        birthDate:      document.getElementById('birthDate').value,
        retirementAge:  parseInt(document.getElementById('retirementAge').value),
        grossSalary:    parseFloat(document.getElementById('grossSalary').value),
        zusTitleCode:   document.getElementById('zusTitleCode').value || null,
        taxRelief:      document.getElementById('taxRelief').checked
      };
      res = await fetch('/api/v1/employees', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        credentials: 'include'
      });
    }

    if (res.ok) {
      window.location.href = 'employees.html';
    } else {
      const err = await res.json().catch(() => ({}));
      alertBox.textContent = err.error || 'Błąd zapisu';
      alertBox.className = 'alert alert-danger';
    }
  });
})();
</script>
</body>
</html>
