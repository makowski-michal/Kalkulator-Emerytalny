<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Pracownika – Kalkulator Płacowy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <div class="sidebar d-none d-md-block" style="width:220px;min-width:220px">
    <div class="px-3 pb-3 fw-bold fs-6 border-bottom border-white border-opacity-25 mb-2">
      💼 Kalkulator Płacowy
    </div>
    <span class="nav-section">Pracownik</span>
    <a href="employee-dashboard.html" class="active">🏠 Pulpit</a>
    <a href="payslips.html">📋 Historia wypłat</a>
    <a href="retirement.html">🏦 Emerytura</a>
    <div class="mt-auto p-3" style="position:absolute;bottom:0;width:220px">
      <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">Wyloguj</button>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-grow-1 p-4">
    <h4 class="mb-4">Witaj, <span id="userName">...</span></h4>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card text-center p-3">
          <div class="text-muted small mb-1">Ostatnie netto</div>
          <div class="fs-3 fw-bold text-success" id="lastNet">–</div>
          <div class="text-muted small" id="lastPeriod">–</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center p-3">
          <div class="text-muted small mb-1">Ostatnie brutto</div>
          <div class="fs-3 fw-bold text-primary" id="lastGross">–</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center p-3">
          <div class="text-muted small mb-1">Koszt pracodawcy</div>
          <div class="fs-3 fw-bold text-secondary" id="lastEmployerCost">–</div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <div class="card p-3">
          <h6 class="mb-3">Szybkie akcje</h6>
          <a href="payslips.html" class="btn btn-outline-primary w-100 mb-2">📋 Przeglądaj historię wypłat</a>
          <a href="retirement.html" class="btn btn-outline-secondary w-100">🏦 Kalkulator emerytalny</a>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h6 class="mb-3">Moje dane</h6>
          <div id="profileInfo" class="small text-muted">Ładowanie...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
(async () => {
  const user = await requireAuth('EMPLOYEE');
  if (!user) return;
  document.getElementById('userName').textContent = user.email;

  // Latest payslip
  const ps = await fetch('/api/v1/payslips/latest', { credentials: 'include' });
  if (ps.ok) {
    const p = await ps.json();
    document.getElementById('lastNet').textContent = fmt(p.netSalary) + ' zł';
    document.getElementById('lastGross').textContent = fmt(p.grossSalary) + ' zł';
    document.getElementById('lastEmployerCost').textContent = fmt(p.employerTotalCost) + ' zł';
    document.getElementById('lastPeriod').textContent =
      monthName(p.periodMonth) + ' ' + p.periodYear;
  } else {
    document.getElementById('lastNet').textContent = 'Brak danych';
  }

  // Employee profile
  const ep = await fetch('/api/v1/employees/me', { credentials: 'include' });
  if (ep.ok) {
    const e = await ep.json();
    document.getElementById('profileInfo').innerHTML =
      `<strong>${e.firstName} ${e.lastName}</strong><br>` +
      `PESEL: ${e.pesel || '–'}<br>` +
      `Firma: ${e.companyName}<br>` +
      `Wynagrodzenie zasadnicze: ${fmt(e.grossSalary)} zł`;
  }
})();
</script>
</body>
</html>
