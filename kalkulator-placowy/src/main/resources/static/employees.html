<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pracownicy – Kalkulator Płacowy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="d-flex">
  <div class="sidebar d-none d-md-block" style="width:220px;min-width:220px">
    <div class="px-3 pb-3 fw-bold fs-6 border-bottom border-white border-opacity-25 mb-2">
      💼 Kalkulator Płacowy
    </div>
    <span class="nav-section">Pracodawca</span>
    <a href="employer-dashboard.html">🏠 Pulpit</a>
    <a href="employees.html" class="active">👥 Pracownicy</a>
    <a href="payslip-form.html">📄 Generuj pasek</a>
    <a href="absences.html">📅 Nieobecności</a>
    <a href="company-settings.html">🏢 Dane firmy</a>
    <div class="mt-auto p-3" style="position:absolute;bottom:0;width:220px">
      <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">Wyloguj</button>
    </div>
  </div>

  <div class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0">Lista pracowników</h4>
      <a href="employee-form.html" class="btn btn-primary btn-sm">➕ Dodaj pracownika</a>
    </div>

    <div class="card p-3 mb-3">
      <div class="row g-2 align-items-end">
        <div class="col">
          <input type="text" id="searchInput" class="form-control form-control-sm"
                 placeholder="Szukaj po nazwisku, imieniu lub PESEL...">
        </div>
        <div class="col-auto">
          <button onclick="loadEmployees()" class="btn btn-primary btn-sm">Szukaj</button>
        </div>
      </div>
    </div>

    <div class="card">
      <table class="table table-hover mb-0" id="empTable">
        <thead class="table-dark">
          <tr>
            <th onclick="sortBy('lastName')" style="cursor:pointer">Nazwisko ↕</th>
            <th onclick="sortBy('firstName')" style="cursor:pointer">Imię ↕</th>
            <th>PESEL</th>
            <th class="text-end">Brutto</th>
            <th class="text-center">Akcje</th>
          </tr>
        </thead>
        <tbody id="empList">
          <tr><td colspan="5" class="text-center text-muted py-4">Ładowanie...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/employees.js"></script>
<script>
(async () => {
  const user = await requireAuth('EMPLOYER');
  if (!user) return;
  await loadEmployees();

  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadEmployees();
  });
})();
</script>
</body>
</html>
