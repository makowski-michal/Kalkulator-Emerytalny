<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logowanie – Kalkulator Płacowy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="login-card card p-4 mt-5">
    <div class="login-logo">💼 Kalkulator Płacowy</div>
    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Adres e-mail</label>
        <input type="email" id="email" class="form-control" placeholder="jan.kowalski@firma.pl" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Hasło</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Zaloguj się</button>
    </form>
    <div class="text-center mt-3">
      <a href="forgot-password.html" class="text-muted small">Zapomniałem hasła</a>
    </div>
  </div>
</div>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alert = document.getElementById('alertBox');
    alert.classList.add('d-none');

    const res = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      }),
      credentials: 'include'
    });

    if (res.ok) {
      const data = await res.json();
      if (data.role === 'EMPLOYER') window.location.href = 'employer-dashboard.html';
      else window.location.href = 'employee-dashboard.html';
    } else {
      const err = await res.json();
      alert.textContent = err.error || 'Błąd logowania';
      alert.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
